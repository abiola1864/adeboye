services:
  - type: web
    name: adeboye-review
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: adeboye2026
      - key: DATABASE_URL
        fromDatabase:
          name: adeboye-db
          property: connectionString

databases:
  - name: adeboye-db
    plan: free
    databaseName: adeboye
    user: adeboye
